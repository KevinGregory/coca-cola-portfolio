[project]
name = "alfred"
version = "0.1.0"
description = "Agentic ad-campaign generator — company name in, three campaign proposals out."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "baml-py>=0.75.0",
    "jinja2>=3.1.4",
    "openai>=1.55.0",
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "replicate>=1.0.0",
]

[project.scripts]
alfred = "alfred.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alfred"]

[tool.hatch.build]
include = [
    "alfred/**/*.py",
    "templates/*.j2",
]
